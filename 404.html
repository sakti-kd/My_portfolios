<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030813"><meta name="robots" content="noindex"><title>Page not found | Saktikanta Dhal</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>:root{color-scheme:dark;--cyan:#22d3ff;--muted:#9aafca}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,#07305a 0,transparent 55%),#030813;color:#f2f7ff;font:16px/1.6 system-ui,sans-serif}.card{max-width:560px;text-align:center;border:1px solid #24517c;border-radius:24px;padding:clamp(28px,6vw,52px);background:#061326d9;box-shadow:0 24px 70px #0005}.mark{display:inline-grid;place-items:center;width:54px;height:54px;border:1px solid var(--cyan);border-radius:15px;color:var(--cyan);font-weight:800}.code{margin:24px 0 0;color:var(--cyan);font-size:clamp(56px,12vw,90px);font-weight:800;line-height:1;letter-spacing:-.07em}h1{margin:16px 0 8px;font-size:clamp(24px,5vw,34px)}p{color:var(--muted);margin:0 0 24px}a{display:inline-block;padding:12px 18px;border-radius:12px;background:linear-gradient(110deg,#06bce9,#2266ff);color:#fff;text-decoration:none;font-weight:700}a:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
/* Compact 3D scene tuning: preserve each page's distinct live scene without pushing content below the fold. */
.scene-stage{margin:18px 0 22px;padding:12px 14px 10px;border-radius:21px}
.page-3d-scene{height:clamp(260px,27vw,340px);margin:3px auto 0;overflow:hidden}
.page-3d-scene .scene-webgl{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2;opacity:1}
.scene-stage-foot{padding:6px 3px 0;font-size:9px}
@media(max-width:800px){
  .scene-stage{margin:13px 0 18px;padding:10px 9px 8px;border-radius:18px}
  .page-3d-scene{height:clamp(205px,56vw,250px);width:100%;margin:2px auto 0;right:auto;top:auto;opacity:1}
  .scene-stage-head{font-size:9px;letter-spacing:.09em}
  .scene-live{font-size:8px}
  .scene-stage-foot{font-size:8px;letter-spacing:.025em;gap:7px;padding-top:5px}
}
@media(max-width:380px){
  .page-3d-scene{height:200px}
  .scene-stage-foot span:first-child{max-width:54%}
  .scene-stage-foot span:last-child{max-width:43%}
}
@media(prefers-reduced-motion:reduce){.page-3d-scene .scene-webgl{opacity:1}}

</style></head><body><main class="card"><span class="mark">SD</span><div class="code">404</div><h1>This page couldn't be found.</h1><p>The address may be incorrect, or the page may have moved.</p><a href="./">Return to portfolio</a></main></body></html>
